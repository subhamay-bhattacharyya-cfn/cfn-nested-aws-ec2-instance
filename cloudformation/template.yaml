AWSTemplateFormatVersion: '2010-09-09'

Description: 'Nested CloudFormation template to create an EC2 instance with optional instance profile, Base64 user data, and optional target group registration. CI deployments also create a VPC with one public subnet and a security group'

Metadata:
  # SubnetId and SecurityGroupIds default to "" so CI deployments do not need
  # them. cfn-lint checks those empty defaults against the ID patterns when the
  # non-CI branch resolves, so W1030 is ignored for the whole template.
  cfn-lint:
    config:
      ignore_checks:
        - W1030
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Naming"
        Parameters:
          - ProjectName
          - InstanceBaseName
          - Environment
          - CiSuffix
      - Label:
          default: "Instance"
        Parameters:
          - ImageId
          - InstanceType
          - KeyName
          - UserDataBase64
      - Label:
          default: "Network"
        Parameters:
          - VpcCidr
          - PublicSubnetCidr
          - SubnetId
          - SecurityGroupIds
      - Label:
          default: "IAM"
        Parameters:
          - InstanceRoleName
      - Label:
          default: "Load Balancing"
        Parameters:
          - TargetGroupArn
          - TargetPort
    ParameterLabels:
      ProjectName:
        default: "Project name"
      InstanceBaseName:
        default: "Instance base name"
      Environment:
        default: "Environment"
      CiSuffix:
        default: "CI suffix"
      VpcCidr:
        default: "VPC CIDR"
      PublicSubnetCidr:
        default: "Public subnet CIDR"
      ImageId:
        default: "AMI ID"
      InstanceType:
        default: "Instance type"
      KeyName:
        default: "Key pair name"
      SubnetId:
        default: "Subnet ID"
      SecurityGroupIds:
        default: "Security group IDs"
      InstanceRoleName:
        default: "Instance role name"
      UserDataBase64:
        default: "User data (Base64)"
      TargetGroupArn:
        default: "Target group ARN"
      TargetPort:
        default: "Target port"

Parameters:
  ProjectName:
    Type: String
    Default: cfn-nstd
    Description: "Project name used in the instance Name tag"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Project name must be lowercase letters, numbers, and hyphens only"

  InstanceBaseName:
    Type: String
    Default: ec2
    Description: "Base name for the instance, used in the Name tag"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Instance base name must be lowercase letters, numbers, and hyphens only"

  Environment:
    Type: String
    Default: devl
    AllowedValues: 
    - devl
    - test
    - prod
    Description: "Deployment environment for the EC2 instance"

  CiSuffix:
    Type: String
    Default: ""
    Description: "Optional CI suffix to append to the instance Name tag"
    MaxLength: 30
    AllowedPattern: "^$|^[a-zA-Z0-9-]+$"
    ConstraintDescription: "CI suffix must be letters, numbers, and hyphens only"

  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: "AMI ID, or SSM parameter holding the AMI ID (defaults to latest Amazon Linux 2023)"

  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues: 
    - t2.micro
    - t3.micro
    - t3.small
    - t3.medium
    - t3.large
    Description: "EC2 instance type"

  KeyName:
    Type: String
    Default: ""
    Description: "Optional name of an existing EC2 key pair for SSH access to the instance. Used only when CiSuffix is empty. CI deployments create their own key pair"
    AllowedPattern: "^$|^[a-zA-Z0-9._-]{1,255}$"
    ConstraintDescription: "Must be an existing EC2 key pair name (letters, numbers, periods, underscores, hyphens) or empty"

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: "CIDR block for the VPC. Used only when CiSuffix is set (CI deployment)"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/(1[6-9]|2[0-8])$"
    ConstraintDescription: "Must be a valid IPv4 CIDR block between /16 and /28"

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: "CIDR block for the public subnet. Used only when CiSuffix is set (CI deployment)"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/(1[6-9]|2[0-8])$"
    ConstraintDescription: "Must be a valid IPv4 CIDR block between /16 and /28"

  SubnetId:
    Type: String
    Default: ""
    Description: "Existing subnet in which to launch the instance. Required when CiSuffix is empty, ignored when it is set"
    AllowedPattern: "^$|^subnet-[a-f0-9]+$"
    ConstraintDescription: "Must be a valid subnet ID or empty"

  SecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: "Existing security group IDs to attach to the instance. Required when CiSuffix is empty, ignored when it is set"

  InstanceRoleName:
    Type: String
    Default: ""
    Description: "Optional name of an existing IAM role. If provided, an instance profile is created for it and attached to the instance"
    AllowedPattern: "^$|^[\\w+=,.@-]{1,64}$"
    ConstraintDescription: "Must be an IAM role name (up to 64 characters, no ARN)"

  UserDataBase64:
    Type: String
    Default: ""
    Description: "Optional user data script, already Base64 encoded. It is passed to the instance as-is"
    MaxLength: 4096
    AllowedPattern: "^$|^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
    ConstraintDescription: "Must be a valid Base64 string"

  TargetGroupArn:
    Type: String
    Default: ""
    Description: "Optional ARN of an existing target group. If provided, the instance is registered with it"
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:targetgroup/.+$"
    ConstraintDescription: "Must be a valid target group ARN or empty"

  TargetPort:
    Type: Number
    Default: 80
    Description: "Port the target group forwards traffic to on the instance. Used only when TargetGroupArn is set"
    MinValue: 1
    MaxValue: 65535

Conditions:
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]
  HasInstanceRole: !Not [!Equals [!Ref InstanceRoleName, ""]]
  HasUserData: !Not [!Equals [!Ref UserDataBase64, ""]]
  HasTargetGroup: !Not [!Equals [!Ref TargetGroupArn, ""]]
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Rules:
  RequireExistingNetwork:
    RuleCondition: !Equals [!Ref CiSuffix, ""]
    Assertions:
      - Assert: !Not [!Equals [!Ref SubnetId, ""]]
        AssertDescription: "SubnetId is required when CiSuffix is empty (non-CI deployment)"

Resources:
  # Network resources are created only for CI deployments (CiSuffix is set).
  Vpc:
    Type: AWS::EC2::VPC
    Condition: HasCiSuffix
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-${AWS::Region}-vpc-${CiSuffix}'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: HasCiSuffix
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-${AWS::Region}-igw-${CiSuffix}'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: HasCiSuffix
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: HasCiSuffix
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-${AWS::Region}-public-${CiSuffix}'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: HasCiSuffix
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-${AWS::Region}-public-rt-${CiSuffix}'

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: HasCiSuffix
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasCiSuffix
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasCiSuffix
    Properties:
      GroupDescription: "Security group for the CI EC2 instance. No inbound rules, all outbound allowed"
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-${AWS::Region}-sg-${CiSuffix}'

  # CI deployments create their own key pair. The private key is stored in
  # SSM Parameter Store under /ec2/keypair/<key-pair-id>.
  KeyPair:
    Type: AWS::EC2::KeyPair
    Condition: HasCiSuffix
    Properties:
      KeyName: !Sub '${AWS::StackName}-key'
      KeyType: rsa
      KeyFormat: pem
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-${AWS::Region}-key-${CiSuffix}'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: HasInstanceRole
    Properties:
      Roles:
        - !Ref InstanceRoleName

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !If
        - HasCiSuffix
        - !Ref PublicSubnet
        - !Ref SubnetId
      SecurityGroupIds: !If
        - HasCiSuffix
        - - !Ref SecurityGroup
        - !Ref SecurityGroupIds
      IamInstanceProfile: !If
        - HasInstanceRole
        - !Ref InstanceProfile
        - !Ref AWS::NoValue
      KeyName: !If
        - HasCiSuffix
        - !Ref KeyPair
        - !If
          - HasKeyName
          - !Ref KeyName
          - !Ref AWS::NoValue
      UserData: !If
        - HasUserData
        - !Ref UserDataBase64
        - !Ref AWS::NoValue
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: !If
            - HasCiSuffix
            - !Sub '${ProjectName}-${InstanceBaseName}-${Environment}-${AWS::Region}-${CiSuffix}'
            - !Sub '${ProjectName}-${InstanceBaseName}-${Environment}-${AWS::Region}'
        - Key: Environment
          Value: !Ref Environment

  # CloudFormation has no native resource for registering a target with an
  # existing target group, so a custom resource (backed by the Lambda below)
  # registers the instance on create and deregisters it on delete.
  TargetRegistrationRole:
    Type: AWS::IAM::Role
    Condition: HasTargetGroup
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RegisterTargets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:DeregisterTargets
                Resource: !Ref TargetGroupArn

  TargetRegistrationFunction:
    Type: AWS::Lambda::Function
    Condition: HasTargetGroup
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TargetRegistrationRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json, urllib.request, boto3
          elb = boto3.client("elbv2")

          def send(event, context, status, physical, reason=""):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch log stream: {context.log_stream_name}",
                  "PhysicalResourceId": physical,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": {},
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                           headers={"Content-Type": "", "Content-Length": str(len(body))})
              urllib.request.urlopen(req, timeout=30)

          def handler(event, context):
              props = event["ResourceProperties"]
              tg, target, port = props["TargetGroupArn"], props["TargetId"], int(props["Port"])
              physical = f"{tg}|{target}|{port}"
              try:
                  kind = event["RequestType"]
                  if kind == "Create":
                      elb.register_targets(TargetGroupArn=tg, Targets=[{"Id": target, "Port": port}])
                  elif kind == "Update" and event.get("PhysicalResourceId") != physical:
                      old = event["OldResourceProperties"]
                      elb.deregister_targets(TargetGroupArn=old["TargetGroupArn"],
                                             Targets=[{"Id": old["TargetId"], "Port": int(old["Port"])}])
                      elb.register_targets(TargetGroupArn=tg, Targets=[{"Id": target, "Port": port}])
                  elif kind == "Delete":
                      try:
                          elb.deregister_targets(TargetGroupArn=tg, Targets=[{"Id": target, "Port": port}])
                      except Exception as e:
                          print(f"Ignoring deregister error on delete: {e}")
                  send(event, context, "SUCCESS", physical)
              except Exception as e:
                  print(f"Error: {e}")
                  send(event, context, "FAILED", event.get("PhysicalResourceId", physical), str(e))

  TargetRegistration:
    Type: AWS::CloudFormation::CustomResource
    Condition: HasTargetGroup
    Properties:
      ServiceToken: !GetAtt TargetRegistrationFunction.Arn
      TargetGroupArn: !Ref TargetGroupArn
      TargetId: !Ref Instance
      Port: !Ref TargetPort

Outputs:
  InstanceId:
    Description: "ID of the EC2 instance"
    Value: !Ref Instance

  InstancePrivateIp:
    Description: "Private IP address of the EC2 instance"
    Value: !GetAtt Instance.PrivateIp

  InstanceProfileArn:
    Condition: HasInstanceRole
    Description: "ARN of the instance profile attached to the EC2 instance"
    Value: !GetAtt InstanceProfile.Arn

  TargetGroupArn:
    Condition: HasTargetGroup
    Description: "ARN of the target group the instance is registered with"
    Value: !Ref TargetGroupArn

  VpcId:
    Condition: HasCiSuffix
    Description: "ID of the VPC created for the CI deployment"
    Value: !Ref Vpc

  PublicSubnetId:
    Condition: HasCiSuffix
    Description: "ID of the public subnet created for the CI deployment"
    Value: !Ref PublicSubnet

  SecurityGroupId:
    Condition: HasCiSuffix
    Description: "ID of the security group created for the CI deployment"
    Value: !Ref SecurityGroup

  KeyPairName:
    Condition: HasCiSuffix
    Description: "Name of the key pair created for the CI deployment"
    Value: !Ref KeyPair
